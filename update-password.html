<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your Dream Land Motel Business Control System password"
    >

    <meta
        name="theme-color"
        content="#14532d"
    >

    <title>
        Dream Land Motel | Reset Password
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page reset-page">

<main class="auth-card reset-card">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="auth-header">

        <img
            class="auth-logo"
            src="images/logo1.png"
            alt="Dream Land Motel Logo"
            onerror="this.style.display='none'"
        >

        <h1>
            Dream Land Motel
        </h1>

        <p id="subtitle">
            Reset your password
        </p>

    </section>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <section class="auth-content">

        <!-- LANGUAGE -->

        <div class="auth-language-row">

            <button
                type="button"
                class="language-btn"
                id="languageButton"
                data-language
                aria-label="Change language"
            >
                Kinyarwanda
            </button>

        </div>


        <!-- =================================================
             RESET FORM
        ================================================== -->

        <form
            id="resetForm"
            novalidate
        >

            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label
                    for="newPassword"
                    id="newPasswordLabel"
                >
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showNewPassword"
                        aria-controls="newPassword"
                        aria-pressed="false"
                    >
                        Show
                    </button>

                </div>

                <p
                    class="password-rules"
                    id="passwordRules"
                >
                    Use at least 8 characters.
                </p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label
                    for="confirmPassword"
                    id="confirmPasswordLabel"
                >
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showConfirmPassword"
                        aria-controls="confirmPassword"
                        aria-pressed="false"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- RESET BUTTON -->

            <button
                type="submit"
                class="auth-submit-btn"
                id="resetButton"
                disabled
            >
                RESET PASSWORD
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>

        </form>


        <!-- =================================================
             BACK TO LOGIN
        ================================================== -->

        <div class="auth-back-container">

            <a
                href="index.html"
                class="auth-back-link"
                id="backLogin"
            >
                Back to Login
            </a>

        </div>

    </section>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="auth-footer">

        Dream Land Motel System 2026

    </footer>

</main>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="i18n.js"></script>


<script>
"use strict";


/*
============================================================
DREAM LAND MOTEL
UPDATE PASSWORD PAGE
============================================================

FLOW:

index.html
    ↓
recovery.html
    ↓
direct-password-recovery
    ↓
Supabase recovery link
    ↓
update-password.html
    ↓
Supabase recovery session
    ↓
updateUser({ password })
    ↓
signOut()
    ↓
index.html


IMPORTANT:
- auth.js is intentionally NOT loaded here.
- Recovery sessions are temporary Supabase Auth sessions.
============================================================
*/


document.addEventListener(
    "DOMContentLoaded",
    function () {

        /*
        ========================================================
        ELEMENTS
        ========================================================
        */

        const resetForm =
            document.getElementById(
                "resetForm"
            );

        const newPasswordInput =
            document.getElementById(
                "newPassword"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const resetButton =
            document.getElementById(
                "resetButton"
            );

        const message =
            document.getElementById(
                "message"
            );

        const showNewPassword =
            document.getElementById(
                "showNewPassword"
            );

        const showConfirmPassword =
            document.getElementById(
                "showConfirmPassword"
            );

        const languageButton =
            document.getElementById(
                "languageButton"
            );

        const subtitle =
            document.getElementById(
                "subtitle"
            );

        const newPasswordLabel =
            document.getElementById(
                "newPasswordLabel"
            );

        const confirmPasswordLabel =
            document.getElementById(
                "confirmPasswordLabel"
            );

        const passwordRules =
            document.getElementById(
                "passwordRules"
            );

        const backLogin =
            document.getElementById(
                "backLogin"
            );


        /*
        ========================================================
        STATE
        ========================================================
        */

        let recoveryReady =
            false;

        let passwordUpdating =
            false;

        let recoveryEventReceived =
            false;

        let recoverySession =
            null;


        /*
        ========================================================
        TRANSLATIONS
        ========================================================
        */

        const translations = {

            en: {

                subtitle:
                    "Reset your password",

                newPassword:
                    "New Password",

                confirmPassword:
                    "Confirm Password",

                rules:
                    "Use at least 8 characters.",

                reset:
                    "RESET PASSWORD",

                updating:
                    "UPDATING...",

                show:
                    "Show",

                hide:
                    "Hide",

                back:
                    "Back to Login",

                invalidSession:
                    "This password recovery session is not valid or has expired. Please request a new recovery link.",

                tooShort:
                    "Password must contain at least 8 characters.",

                mismatch:
                    "The passwords do not match.",

                success:
                    "Password updated successfully. You can now login with your new password.",

                genericError:
                    "We could not update your password. Please request a new recovery link and try again.",

                samePassword:
                    "Your new password must be different from the old password."

            },


            rw: {

                subtitle:
                    "Hindura ijambo ry'ibanga",

                newPassword:
                    "Password nshya",

                confirmPassword:
                    "Emeza password",

                rules:
                    "Koresha nibura inyuguti 8.",

                reset:
                    "HINDURA PASSWORD",

                updating:
                    "BIRIMO GUHINDURWA...",

                show:
                    "Erekana",

                hide:
                    "Hisha",

                back:
                    "Subira kuri Login",

                invalidSession:
                    "Session yo guhindura password ntabwo yemewe cyangwa yararengeje igihe. Saba recovery link nshya.",

                tooShort:
                    "Password igomba kugira nibura inyuguti 8.",

                mismatch:
                    "Password zombi ntizihura.",

                success:
                    "Password yahinduwe neza. Ushobora noneho kwinjira ukoresheje password nshya.",

                genericError:
                    "Ntabwo twashoboye guhindura password. Saba recovery link nshya wongere ugerageze.",

                samePassword:
                    "Password nshya igomba kuba itandukanye n'iya kera."

            }

        };


        /*
        ========================================================
        LANGUAGE
        ========================================================
        */

        function getLanguage() {

            if (
                window.DreamLandI18n &&
                typeof
                    window.DreamLandI18n.getLanguage
                    === "function"
            ) {

                const sharedLanguage =
                    window.DreamLandI18n.getLanguage();


                if (
                    sharedLanguage === "rw" ||
                    sharedLanguage === "en"
                ) {

                    return sharedLanguage;

                }

            }


            const stored =
                localStorage.getItem(
                    "dreamland_language"
                );


            return stored === "rw"
                ? "rw"
                : "en";

        }


        let language =
            getLanguage();


        function setLanguage(
            nextLanguage
        ) {

            if (
                nextLanguage !== "en" &&
                nextLanguage !== "rw"
            ) {

                return;

            }


            language =
                nextLanguage;


            localStorage.setItem(
                "dreamland_language",
                language
            );


            if (
                window.DreamLandI18n &&
                typeof
                    window.DreamLandI18n.setLanguage
                    === "function"
            ) {

                window.DreamLandI18n.setLanguage(
                    language
                );

            }


            updateLanguage();

        }


        function t(key) {

            return (
                translations[language]?.[key]
                ||
                translations.en[key]
                ||
                key
            );

        }


        /*
        ========================================================
        LANGUAGE UI
        ========================================================
        */

        function updateLanguage() {

            language =
                getLanguage();


            document.documentElement.lang =
                language;


            subtitle.textContent =
                t("subtitle");


            newPasswordLabel.textContent =
                t("newPassword");


            confirmPasswordLabel.textContent =
                t("confirmPassword");


            passwordRules.textContent =
                t("rules");


            backLogin.textContent =
                t("back");


            if (
                !passwordUpdating
            ) {

                resetButton.textContent =
                    t("reset");

            }


            showNewPassword.textContent =
                newPasswordInput.type === "password"
                    ? t("show")
                    : t("hide");


            showConfirmPassword.textContent =
                confirmPasswordInput.type === "password"
                    ? t("show")
                    : t("hide");


            showNewPassword.setAttribute(
                "aria-pressed",
                String(
                    newPasswordInput.type !== "password"
                )
            );


            showConfirmPassword.setAttribute(
                "aria-pressed",
                String(
                    confirmPasswordInput.type !== "password"
                )
            );


            if (
                window.DreamLandI18n &&
                typeof
                    window.DreamLandI18n
                        .updateLanguageButtons
                    === "function"
            ) {

                window.DreamLandI18n
                    .updateLanguageButtons();

            }
            else {

                languageButton.textContent =
                    language === "rw"
                        ? "English"
                        : "Kinyarwanda";

            }

        }


        /*
        ========================================================
        LANGUAGE BUTTON
        ========================================================
        */

        languageButton.addEventListener(
            "click",
            function () {

                setLanguage(
                    language === "en"
                        ? "rw"
                        : "en"
                );

            }
        );


        /*
        ========================================================
        MESSAGE
        ========================================================
        */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                `auth-message ${type}`;

        }


        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "auth-message";

        }


        /*
        ========================================================
        RECOVERY STATE
        ========================================================
        */

        function setRecoveryReady(
            value,
            session
        ) {

            recoveryReady =
                value === true;

            recoverySession =
                session || recoverySession || null;


            resetButton.disabled =
                !recoveryReady ||
                passwordUpdating;

        }


        /*
        ========================================================
        SHOW / HIDE PASSWORD
        ========================================================
        */

        showNewPassword.addEventListener(
            "click",
            function () {

                const showing =
                    newPasswordInput.type ===
                    "password";


                newPasswordInput.type =
                    showing
                        ? "text"
                        : "password";


                updateLanguage();


                newPasswordInput.focus();

            }
        );


        showConfirmPassword.addEventListener(
            "click",
            function () {

                const showing =
                    confirmPasswordInput.type ===
                    "password";


                confirmPasswordInput.type =
                    showing
                        ? "text"
                        : "password";


                updateLanguage();


                confirmPasswordInput.focus();

            }
        );


        /*
        ========================================================
        URL PARAMETERS
        ========================================================
        */

        function getUrlParameters() {

            const hash =
                window.location.hash || "";

            const search =
                window.location.search || "";


            const hashText =
                hash.startsWith("#")
                    ? hash.substring(1)
                    : hash;


            const searchText =
                search.startsWith("?")
                    ? search.substring(1)
                    : search;


            return {

                hash:
                    new URLSearchParams(
                        hashText
                    ),

                search:
                    new URLSearchParams(
                        searchText
                    )

            };

        }


        /*
        ========================================================
        RECOVERY URL ERROR
        ========================================================
        */

        function hasRecoveryUrlError() {

            const params =
                getUrlParameters();


            const errorCode =
                params.hash.get(
                    "error_code"
                ) ||
                params.search.get(
                    "error_code"
                );


            const errorDescription =
                params.hash.get(
                    "error_description"
                ) ||
                params.search.get(
                    "error_description"
                );


            return Boolean(
                errorCode ||
                errorDescription
            );

        }


        /*
        ========================================================
        RECOVERY URL DETECTION
        ========================================================
        */

        function hasRecoveryUrl() {

            const params =
                getUrlParameters();


            const hashType =
                params.hash.get(
                    "type"
                );


            const searchType =
                params.search.get(
                    "type"
                );


            if (
                hashType === "recovery" ||
                searchType === "recovery"
            ) {

                return true;

            }


            const hasAccessToken =
                Boolean(
                    params.hash.get(
                        "access_token"
                    )
                );


            const hasRefreshToken =
                Boolean(
                    params.hash.get(
                        "refresh_token"
                    )
                );


            return (
                hasAccessToken &&
                hasRefreshToken
            );

        }


        /*
        ========================================================
        SUPABASE AUTH STATE LISTENER
        ========================================================
        */

        const {
            data: authListener
        } =
            db.auth.onAuthStateChange(
                function (
                    event,
                    session
                ) {

                    console.log(
                        "Dream Land Auth Event:",
                        event
                    );


                    /*
                     * This is the official Supabase
                     * recovery event.
                     */

                    if (
                        event ===
                        "PASSWORD_RECOVERY"
                    ) {

                        recoveryEventReceived =
                            true;


                        if (
                            session
                        ) {

                            setRecoveryReady(
                                true,
                                session
                            );


                            clearMessage();

                            console.log(
                                "Recovery session ready."
                            );

                        }
                        else {

                            setRecoveryReady(
                                false,
                                null
                            );


                            showMessage(
                                t("invalidSession"),
                                "error"
                            );

                        }


                        return;

                    }


                    /*
                     * Supabase may emit SIGNED_IN while
                     * processing the recovery link.
                     */

                    if (
                        event ===
                        "SIGNED_IN" &&
                        session &&
                        hasRecoveryUrl()
                    ) {

                        recoveryEventReceived =
                            true;


                        setRecoveryReady(
                            true,
                            session
                        );


                        clearMessage();


                        return;

                    }

                }
            );


        /*
        ========================================================
        VERIFY RECOVERY SESSION
        ========================================================
        */

        async function verifyRecoverySession() {

            /*
             * First check explicit URL errors.
             */

            if (
                hasRecoveryUrlError()
            ) {

                setRecoveryReady(
                    false,
                    null
                );


                showMessage(
                    t("invalidSession"),
                    "error"
                );


                return;

            }


            try {

                const {
                    data,
                    error
                } =
                    await db.auth.getSession();


                if (
                    error
                ) {

                    throw error;

                }


                const session =
                    data?.session || null;


                /*
                 * If PASSWORD_RECOVERY already fired,
                 * trust the active session.
                 */

                if (
                    recoveryEventReceived &&
                    session
                ) {

                    setRecoveryReady(
                        true,
                        session
                    );


                    clearMessage();


                    return;

                }


                /*
                 * IMPORTANT FIX:
                 *
                 * A valid Supabase recovery link can
                 * already have a session before the
                 * PASSWORD_RECOVERY event is observed.
                 *
                 * Therefore, if:
                 *
                 * 1. the URL is clearly a recovery URL
                 * 2. a valid session exists
                 *
                 * we accept it.
                 */

                if (
                    hasRecoveryUrl() &&
                    session
                ) {

                    recoverySession =
                        session;


                    setRecoveryReady(
                        true,
                        session
                    );


                    clearMessage();


                    console.log(
                        "Recovery session detected from URL."
                    );


                    return;

                }


                /*
                 * Give Supabase a short additional
                 * moment to finish processing the
                 * recovery URL.
                 */

                let attempts =
                    0;

                const maxAttempts =
                    5;


                const retryRecovery =
                    async function () {

                        attempts++;


                        try {

                            const {
                                data:
                                    retryData,
                                error:
                                    retryError
                            } =
                                await db.auth.getSession();


                            if (
                                retryError
                            ) {

                                throw retryError;

                            }


                            const retrySession =
                                retryData?.session ||
                                null;


                            if (
                                retrySession &&
                                (
                                    recoveryEventReceived ||
                                    hasRecoveryUrl()
                                )
                            ) {

                                recoverySession =
                                    retrySession;


                                setRecoveryReady(
                                    true,
                                    retrySession
                                );


                                clearMessage();


                                console.log(
                                    "Recovery session confirmed."
                                );


                                return;

                            }

                        }
                        catch (error) {

                            console.error(
                                "Recovery retry error:",
                                error
                            );

                        }


                        if (
                            attempts <
                            maxAttempts
                        ) {

                            window.setTimeout(
                                retryRecovery,
                                600
                            );

                            return;

                        }


                        setRecoveryReady(
                            false,
                            null
                        );


                        showMessage(
                            t("invalidSession"),
                            "error"
                        );

                    };


                window.setTimeout(
                    retryRecovery,
                    500
                );

            }
            catch (error) {

                console.error(
                    "Recovery session verification error:",
                    error
                );


                setRecoveryReady(
                    false,
                    null
                );


                showMessage(
                    t("invalidSession"),
                    "error"
                );

            }

        }


        /*
        ========================================================
        RESET PASSWORD
        ========================================================
        */

        resetForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                clearMessage();


                const newPassword =
                    newPasswordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                /*
                 * ------------------------------------------------
                 * RECOVERY SESSION REQUIRED
                 * ------------------------------------------------
                 */

                if (
                    !recoveryReady ||
                    !recoverySession
                ) {

                    showMessage(
                        t("invalidSession"),
                        "error"
                    );


                    return;

                }


                /*
                 * ------------------------------------------------
                 * PASSWORD LENGTH
                 * ------------------------------------------------
                 */

                if (
                    newPassword.length < 8
                ) {

                    showMessage(
                        t("tooShort"),
                        "error"
                    );


                    newPasswordInput.focus();


                    return;

                }


                /*
                 * ------------------------------------------------
                 * PASSWORD MATCH
                 * ------------------------------------------------
                 */

                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showMessage(
                        t("mismatch"),
                        "error"
                    );


                    confirmPasswordInput.focus();


                    return;

                }


                /*
                 * ------------------------------------------------
                 * START UPDATE
                 * ------------------------------------------------
                 */

                passwordUpdating =
                    true;


                resetButton.disabled =
                    true;


                resetButton.textContent =
                    t("updating");


                try {

                    /*
                     * Confirm that the recovery
                     * session is still alive.
                     */

                    const {
                        data:
                            currentSessionData,
                        error:
                            currentSessionError
                    } =
                        await db.auth.getSession();


                    if (
                        currentSessionError
                    ) {

                        throw currentSessionError;

                    }


                    const currentSession =
                        currentSessionData?.session ||
                        null;


                    if (
                        !currentSession
                    ) {

                        throw new Error(
                            "RECOVERY_SESSION_EXPIRED"
                        );

                    }


                    /*
                     * ------------------------------------------------
                     * UPDATE PASSWORD
                     * ------------------------------------------------
                     */

                    const {
                        data,
                        error
                    } =
                        await db.auth.updateUser({

                            password:
                                newPassword

                        });


                    if (
                        error
                    ) {

                        throw error;

                    }


                    if (
                        !data?.user
                    ) {

                        throw new Error(
                            "PASSWORD_UPDATE_NOT_CONFIRMED"
                        );

                    }


                    /*
                     * ------------------------------------------------
                     * SUCCESS
                     * ------------------------------------------------
                     */

                    showMessage(
                        t("success"),
                        "success"
                    );


                    setRecoveryReady(
                        false,
                        null
                    );


                    resetForm.reset();


                    passwordUpdating =
                        true;


                    /*
                     * Give the user time to see
                     * the success message.
                     */

                    window.setTimeout(
                        async function () {

                            try {

                                await
                                    db.auth.signOut({
                                        scope: "local"
                                    });

                            }
                            catch (signOutError) {

                                console.warn(
                                    "Recovery sign-out warning:",
                                    signOutError
                                );

                            }


                            window.location.href =
                                "index.html";

                        },
                        1800
                    );

                }
                catch (error) {

                    console.error(
                        "Dream Land password update error:",
                        error
                    );


                    const errorText =
                        String(
                            error?.message || ""
                        ).toLowerCase();


                    let errorMessage =
                        t("genericError");


                    if (
                        errorText.includes(
                            "same_password"
                        ) ||
                        errorText.includes(
                            "same password"
                        )
                    ) {

                        errorMessage =
                            t("samePassword");

                    }


                    if (
                        errorText.includes(
                            "session"
                        ) ||
                        errorText.includes(
                            "jwt"
                        ) ||
                        errorText.includes(
                            "expired"
                        )
                    ) {

                        errorMessage =
                            t("invalidSession");

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );


                    passwordUpdating =
                        false;


                    /*
                     * Check whether the recovery
                     * session is still usable.
                     */

                    try {

                        const {
                            data:
                                retrySessionData
                        } =
                            await db.auth.getSession();


                        const retrySession =
                            retrySessionData?.session ||
                            null;


                        if (
                            retrySession &&
                            hasRecoveryUrl()
                        ) {

                            recoverySession =
                                retrySession;


                            setRecoveryReady(
                                true,
                                retrySession
                            );

                        }
                        else {

                            setRecoveryReady(
                                false,
                                null
                            );

                        }

                    }
                    catch (
                        sessionCheckError
                    ) {

                        console.error(
                            "Session check after error:",
                            sessionCheckError
                        );


                        setRecoveryReady(
                            false,
                            null
                        );

                    }


                    updateLanguage();

                }

            }
        );


        /*
        ========================================================
        CLEANUP AUTH LISTENER
        ========================================================
        */

        window.addEventListener(
            "beforeunload",
            function () {

                try {

                    authListener?.subscription?.unsubscribe();

                }
                catch (error) {

                    console.warn(
                        "Auth listener cleanup warning:",
                        error
                    );

                }

            }
        );


        /*
        ========================================================
        INITIALIZATION
        ========================================================
        */

        updateLanguage();


        verifyRecoverySession();


        console.log(
            "DREAM LAND UPDATE PASSWORD READY"
        );

    }
);
</script>

</body>

</html>
