<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Reset your Dream Land Motel Business Control System password"
    >

    <meta
        name="theme-color"
        content="#14532d"
    >

    <title>
        Dream Land Motel | Reset Password
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="auth-page reset-page">

<main class="auth-card reset-card">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <section class="auth-header">

        <img
            class="auth-logo"
            src="images/logo1.png"
            alt="Dream Land Motel Logo"
            onerror="this.style.display='none'"
        >

        <h1>
            Dream Land Motel
        </h1>

        <p id="subtitle">
            Reset your password
        </p>

    </section>


    <!-- =====================================================
         CONTENT
    ====================================================== -->

    <section class="auth-content">

        <!-- LANGUAGE -->

        <div class="auth-language-row">

            <button
                type="button"
                class="language-btn"
                id="languageButton"
                data-language
                aria-label="Change language"
            >
                Kinyarwanda
            </button>

        </div>


        <!-- =================================================
             RESET FORM
        ================================================== -->

        <form
            id="resetForm"
            novalidate
        >

            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label
                    for="newPassword"
                    id="newPasswordLabel"
                >
                    New Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showNewPassword"
                        aria-controls="newPassword"
                        aria-pressed="false"
                    >
                        Show
                    </button>

                </div>

                <p
                    class="password-rules"
                    id="passwordRules"
                >
                    Use at least 8 characters.
                </p>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label
                    for="confirmPassword"
                    id="confirmPasswordLabel"
                >
                    Confirm Password
                </label>

                <div class="password-wrapper">

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="128"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showConfirmPassword"
                        aria-controls="confirmPassword"
                        aria-pressed="false"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- RESET BUTTON -->

            <button
                type="submit"
                class="auth-submit-btn"
                id="resetButton"
                disabled
            >
                RESET PASSWORD
            </button>


            <!-- MESSAGE -->

            <div
                id="message"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>

        </form>


        <!-- =================================================
             BACK TO LOGIN
        ================================================== -->

        <div class="auth-back-container">

            <a
                href="index.html"
                class="auth-back-link"
                id="backLogin"
            >
                Back to Login
            </a>

        </div>

    </section>


    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="auth-footer">

        Dream Land Motel System 2026

    </footer>

</main>


<!-- =========================================================
     SUPABASE
========================================================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>

<script src="i18n.js"></script>


<script>
"use strict";


/*
============================================================
DREAM LAND MOTEL
UPDATE PASSWORD PAGE
============================================================

This page is reached only after the recovery flow.

Expected flow:

index.html
    ↓
recovery.html
    ↓
direct-password-recovery
    ↓
Supabase recovery action link
    ↓
update-password.html
    ↓
PASSWORD_RECOVERY event
    ↓
updateUser({ password })
    ↓
index.html
*/


document.addEventListener(
    "DOMContentLoaded",
    function () {

        /*
        ========================================================
        ELEMENTS
        ========================================================
        */

        const resetForm =
            document.getElementById(
                "resetForm"
            );

        const newPasswordInput =
            document.getElementById(
                "newPassword"
            );

        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );

        const resetButton =
            document.getElementById(
                "resetButton"
            );

        const message =
            document.getElementById(
                "message"
            );

        const showNewPassword =
            document.getElementById(
                "showNewPassword"
            );

        const showConfirmPassword =
            document.getElementById(
                "showConfirmPassword"
            );

        const languageButton =
            document.getElementById(
                "languageButton"
            );

        const subtitle =
            document.getElementById(
                "subtitle"
            );

        const newPasswordLabel =
            document.getElementById(
                "newPasswordLabel"
            );

        const confirmPasswordLabel =
            document.getElementById(
                "confirmPasswordLabel"
            );

        const passwordRules =
            document.getElementById(
                "passwordRules"
            );

        const backLogin =
            document.getElementById(
                "backLogin"
            );


        /*
        ========================================================
        STATE
        ========================================================
        */

        let recoveryReady =
            false;

        let passwordUpdating =
            false;

        let recoveryEventReceived =
            false;


        /*
        ========================================================
        TRANSLATIONS
        ========================================================
        */

        const translations = {

            en: {

                subtitle:
                    "Reset your password",

                newPassword:
                    "New Password",

                confirmPassword:
                    "Confirm Password",

                rules:
                    "Use at least 8 characters.",

                reset:
                    "RESET PASSWORD",

                updating:
                    "UPDATING...",

                show:
                    "Show",

                hide:
                    "Hide",

                back:
                    "Back to Login",

                language:
                    "Kinyarwanda",

                invalidSession:
                    "This password recovery session is not valid or has expired. Please request a new recovery code.",

                tooShort:
                    "Password must contain at least 8 characters.",

                mismatch:
                    "The passwords do not match.",

                success:
                    "Password updated successfully. You can now login with your new password.",

                genericError:
                    "We could not update your password. Please request a new recovery code and try again.",

                samePassword:
                    "Your new password must be different from the old password."

            },


            rw: {

                subtitle:
                    "Hindura ijambo ry'ibanga",

                newPassword:
                    "Password nshya",

                confirmPassword:
                    "Emeza password",

                rules:
                    "Koresha nibura inyuguti 8.",

                reset:
                    "HINDURA PASSWORD",

                updating:
                    "BIRIMO GUHINDURWA...",

                show:
                    "Erekana",

                hide:
                    "Hisha",

                back:
                    "Subira kuri Login",

                language:
                    "English",

                invalidSession:
                    "Session yo guhindura password ntabwo yemewe cyangwa yararengeje igihe. Saba recovery code nshya.",

                tooShort:
                    "Password igomba kugira nibura inyuguti 8.",

                mismatch:
                    "Password zombi ntizihura.",

                success:
                    "Password yahinduwe neza. Ushobora noneho kwinjira ukoresheje password nshya.",

                genericError:
                    "Ntabwo twashoboye guhindura password. Saba recovery code nshya wongere ugerageze.",

                samePassword:
                    "Password nshya igomba kuba itandukanye n'iya kera."

            }

        };


        /*
        ========================================================
        LANGUAGE
        ========================================================
        */

        function getLanguage() {

            if (
                window.DreamLandI18n &&
                typeof
                    window.DreamLandI18n.getLanguage
                    === "function"
            ) {

                const sharedLanguage =
                    window.DreamLandI18n.getLanguage();


                if (
                    sharedLanguage === "rw" ||
                    sharedLanguage === "en"
                ) {

                    return sharedLanguage;

                }

            }


            const stored =
                localStorage.getItem(
                    "dreamland_language"
                );


            return stored === "rw"
                ? "rw"
                : "en";

        }


        let language =
            getLanguage();


        function setLanguage(
            nextLanguage
        ) {

            if (
                nextLanguage !== "en" &&
                nextLanguage !== "rw"
            ) {

                return;

            }


            language =
                nextLanguage;


            localStorage.setItem(
                "dreamland_language",
                language
            );


            if (
                window.DreamLandI18n &&
                typeof
                    window.DreamLandI18n.setLanguage
                    === "function"
            ) {

                window.DreamLandI18n.setLanguage(
                    language
                );

            }


            updateLanguage();

        }


        function t(key) {

            return (
                translations[language]?.[key]
                ||
                translations.en[key]
                ||
                key
            );

        }


        /*
        ========================================================
        LANGUAGE UI
        ========================================================
        */

        function updateLanguage() {

            language =
                getLanguage();


            document.documentElement.lang =
                language;


            subtitle.textContent =
                t("subtitle");


            newPasswordLabel.textContent =
                t("newPassword");


            confirmPasswordLabel.textContent =
                t("confirmPassword");


            passwordRules.textContent =
                t("rules");


            backLogin.textContent =
                t("back");


            if (
                !passwordUpdating
            ) {

                resetButton.textContent =
                    t("reset");

            }


            showNewPassword.textContent =
                newPasswordInput.type === "password"
                    ? t("show")
                    : t("hide");


            showConfirmPassword.textContent =
                confirmPasswordInput.type === "password"
                    ? t("show")
                    : t("hide");


            showNewPassword.setAttribute(
                "aria-pressed",
                String(
                    newPasswordInput.type !== "password"
                )
            );


            showConfirmPassword.setAttribute(
                "aria-pressed",
                String(
                    confirmPasswordInput.type !== "password"
                )
            );


            if (
                window.DreamLandI18n &&
                typeof
                    window.DreamLandI18n
                        .updateLanguageButtons
                    === "function"
            ) {

                window.DreamLandI18n
                    .updateLanguageButtons();

            }
            else {

                languageButton.textContent =
                    language === "rw"
                        ? "English"
                        : "Kinyarwanda";

            }

        }


        /*
        ========================================================
        LANGUAGE BUTTON FALLBACK
        ========================================================
        */

        if (
            !window.DreamLandI18n
        ) {

            languageButton.addEventListener(
                "click",
                function () {

                    setLanguage(
                        language === "en"
                            ? "rw"
                            : "en"
                    );

                }
            );

        }


        /*
        ========================================================
        MESSAGE
        ========================================================
        */

        function showMessage(
            text,
            type
        ) {

            message.textContent =
                text;

            message.className =
                `auth-message ${type}`;

        }


        function clearMessage() {

            message.textContent =
                "";

            message.className =
                "auth-message";

        }


        /*
        ========================================================
        RECOVERY STATE
        ========================================================
        */

        function setRecoveryReady(
            value
        ) {

            recoveryReady =
                value === true;


            resetButton.disabled =
                !recoveryReady ||
                passwordUpdating;

        }


        /*
        ========================================================
        SHOW / HIDE PASSWORD
        ========================================================
        */

        showNewPassword.addEventListener(
            "click",
            function () {

                const showing =
                    newPasswordInput.type ===
                    "password";


                newPasswordInput.type =
                    showing
                        ? "text"
                        : "password";


                updateLanguage();


                newPasswordInput.focus();

            }
        );


        showConfirmPassword.addEventListener(
            "click",
            function () {

                const showing =
                    confirmPasswordInput.type ===
                    "password";


                confirmPasswordInput.type =
                    showing
                        ? "text"
                        : "password";


                updateLanguage();


                confirmPasswordInput.focus();

            }
        );


        /*
        ========================================================
        RECOVERY URL ERROR
        ========================================================
        */

        function hasRecoveryUrlError() {

            const hash =
                window.location.hash || "";


            const search =
                window.location.search || "";


            const hashText =
                hash.startsWith("#")
                    ? hash.substring(1)
                    : hash;


            const searchText =
                search.startsWith("?")
                    ? search.substring(1)
                    : search;


            const hashParams =
                new URLSearchParams(
                    hashText
                );


            const searchParams =
                new URLSearchParams(
                    searchText
                );


            const errorCode =
                hashParams.get(
                    "error_code"
                ) ||
                searchParams.get(
                    "error_code"
                );


            const errorDescription =
                hashParams.get(
                    "error_description"
                ) ||
                searchParams.get(
                    "error_description"
                );


            return Boolean(
                errorCode ||
                errorDescription
            );

        }


        /*
        ========================================================
        RECOVERY URL DETECTION
        ========================================================
        */

        function hasRecoveryUrl() {

            const hash =
                window.location.hash || "";


            const search =
                window.location.search || "";


            const hashText =
                hash.startsWith("#")
                    ? hash.substring(1)
                    : hash;


            const searchText =
                search.startsWith("?")
                    ? search.substring(1)
                    : search;


            const hashParams =
                new URLSearchParams(
                    hashText
                );


            const searchParams =
                new URLSearchParams(
                    searchText
                );


            /*
             * Supabase recovery redirects can
             * contain type=recovery in the URL.
             */

            const hashType =
                hashParams.get("type");


            const searchType =
                searchParams.get("type");


            if (
                hashType === "recovery" ||
                searchType === "recovery"
            ) {

                return true;

            }


            /*
             * A recovery action may also carry
             * access/refresh token information.
             */

            const hasAccessToken =
                Boolean(
                    hashParams.get(
                        "access_token"
                    )
                );


            const hasRefreshToken =
                Boolean(
                    hashParams.get(
                        "refresh_token"
                    )
                );


            return (
                hasAccessToken &&
                hasRefreshToken
            );

        }


        /*
        ========================================================
        SUPABASE AUTH STATE LISTENER
        ========================================================
        */

        const {
            data: authListener
        } =
            db.auth.onAuthStateChange(
                function (
                    event,
                    session
                ) {

                    console.log(
                        "Dream Land Auth Event:",
                        event
                    );


                    /*
                     * Supabase documents PASSWORD_RECOVERY
                     * as the event to use when the user
                     * arrives through a password recovery link.
                     */

                    if (
                        event ===
                        "PASSWORD_RECOVERY"
                    ) {

                        if (
                            session
                        ) {

                            recoveryEventReceived =
                                true;


                            setRecoveryReady(
                                true
                            );


                            clearMessage();

                        }
                        else {

                            setRecoveryReady(
                                false
                            );

                        }


                        return;

                    }


                    /*
                     * Do not treat an ordinary SIGNED_IN
                     * event as password recovery.
                     */

                    if (
                        event ===
                        "SIGNED_IN"
                    ) {

                        if (
                            hasRecoveryUrl() &&
                            session
                        ) {

                            recoveryEventReceived =
                                true;


                            setRecoveryReady(
                                true
                            );

                        }

                    }

                }
            );


        /*
        ========================================================
        VERIFY RECOVERY SESSION
        ========================================================
        */

        async function verifyRecoverySession() {

            /*
             * URL contains an explicit error.
             */

            if (
                hasRecoveryUrlError()
            ) {

                setRecoveryReady(
                    false
                );


                showMessage(
                    t("invalidSession"),
                    "error"
                );


                return;

            }


            try {

                const {
                    data,
                    error
                } =
                    await db.auth.getSession();


                if (
                    error
                ) {

                    throw error;

                }


                const session =
                    data?.session || null;


                /*
                 * Strongest case:
                 * PASSWORD_RECOVERY event was received.
                 */

                if (
                    recoveryEventReceived &&
                    session
                ) {

                    setRecoveryReady(
                        true
                    );


                    return;

                }


                /*
                 * If this URL does not look like a
                 * recovery URL, an existing ordinary
                 * login session must NOT be allowed
                 * to reset the password.
                 */

                if (
                    !hasRecoveryUrl()
                ) {

                    setRecoveryReady(
                        false
                    );


                    showMessage(
                        t("invalidSession"),
                        "error"
                    );


                    return;

                }


                /*
                 * Give Supabase a short moment to
                 * process the recovery URL and emit
                 * PASSWORD_RECOVERY.
                 */

                setTimeout(
                    async function () {

                        try {

                            const {
                                data:
                                    delayedData,
                                error:
                                    delayedError
                            } =
                                await db.auth.getSession();


                            if (
                                delayedError
                            ) {

                                throw delayedError;

                            }


                            if (
                                delayedData?.session &&
                                recoveryEventReceived
                            ) {

                                setRecoveryReady(
                                    true
                                );


                                clearMessage();

                                return;

                            }

                        }
                        catch (error) {

                            console.error(
                                "Delayed recovery verification error:",
                                error
                            );

                        }


                        /*
                         * Do not accept a session merely
                         * because one exists.
                         */

                        setRecoveryReady(
                            false
                        );


                        showMessage(
                            t("invalidSession"),
                            "error"
                        );

                    },
                    1000
                );

            }
            catch (error) {

                console.error(
                    "Recovery session verification error:",
                    error
                );


                setRecoveryReady(
                    false
                );


                showMessage(
                    t("invalidSession"),
                    "error"
                );

            }

        }


        /*
        ========================================================
        RESET PASSWORD
        ========================================================
        */

        resetForm.addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                clearMessage();


                const newPassword =
                    newPasswordInput.value;


                const confirmPassword =
                    confirmPasswordInput.value;


                /*
                 * ------------------------------------------------
                 * RECOVERY SESSION REQUIRED
                 * ------------------------------------------------
                 */

                if (
                    !recoveryReady
                ) {

                    showMessage(
                        t("invalidSession"),
                        "error"
                    );


                    return;

                }


                /*
                 * ------------------------------------------------
                 * PASSWORD LENGTH
                 * ------------------------------------------------
                 */

                if (
                    newPassword.length < 8
                ) {

                    showMessage(
                        t("tooShort"),
                        "error"
                    );


                    newPasswordInput.focus();


                    return;

                }


                /*
                 * ------------------------------------------------
                 * PASSWORD MATCH
                 * ------------------------------------------------
                 */

                if (
                    newPassword !==
                    confirmPassword
                ) {

                    showMessage(
                        t("mismatch"),
                        "error"
                    );


                    confirmPasswordInput.focus();


                    return;

                }


                /*
                 * ------------------------------------------------
                 * START UPDATE
                 * ------------------------------------------------
                 */

                passwordUpdating =
                    true;


                resetButton.disabled =
                    true;


                resetButton.textContent =
                    t("updating");


                try {

                    /*
                     * Supabase requires the user to
                     * be signed in before updateUser().
                     */

                    const {
                        data,
                        error
                    } =
                        await db.auth.updateUser({

                            password:
                                newPassword

                        });


                    if (
                        error
                    ) {

                        throw error;

                    }


                    if (
                        !data?.user
                    ) {

                        throw new Error(
                            "PASSWORD_UPDATE_NOT_CONFIRMED"
                        );

                    }


                    /*
                     * ------------------------------------------------
                     * SUCCESS
                     * ------------------------------------------------
                     */

                    showMessage(
                        t("success"),
                        "success"
                    );


                    setRecoveryReady(
                        false
                    );


                    passwordUpdating =
                        true;


                    resetForm.reset();


                    /*
                     * End the temporary recovery
                     * session before returning to login.
                     */

                    window.setTimeout(
                        async function () {

                            try {

                                await
                                    db.auth.signOut({
                                        scope: "local"
                                    });

                            }
                            catch (signOutError) {

                                console.warn(
                                    "Recovery sign-out warning:",
                                    signOutError
                                );

                            }


                            window.location.href =
                                "index.html";

                        },
                        1800
                    );

                }
                catch (error) {

                    console.error(
                        "Dream Land password update error:",
                        error
                    );


                    const errorText =
                        String(
                            error?.message || ""
                        ).toLowerCase();


                    let errorMessage =
                        t("genericError");


                    if (
                        errorText.includes(
                            "same_password"
                        ) ||
                        errorText.includes(
                            "same password"
                        )
                    ) {

                        errorMessage =
                            t("samePassword");

                    }


                    showMessage(
                        errorMessage,
                        "error"
                    );


                    passwordUpdating =
                        false;


                    /*
                     * If the recovery session is
                     * still valid, allow retry.
                     */

                    if (
                        recoveryEventReceived
                    ) {

                        setRecoveryReady(
                            true
                        );

                    }
                    else {

                        setRecoveryReady(
                            false
                        );

                    }


                    updateLanguage();

                }

            }
        );


        /*
        ========================================================
        INITIALIZATION
        ========================================================
        */

        updateLanguage();


        verifyRecoverySession();


        console.log(
            "DREAM LAND UPDATE PASSWORD READY"
        );

    }
);
</script>

</body>

</html>
