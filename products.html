<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Dream Land Motel System</title>

    <meta
        name="description"
        content="Dream Land Motel Business Control System - Products"
    >

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="i18n.js"></script>
    <script src="auth.js"></script>
</head>


<body>

<header class="site-header">

    <div class="header-inner">

        <div>
            <h2>Dream Land Motel</h2>

            <div data-i18n="systemTitle">
                Business Control System
            </div>
        </div>


        <div class="header-actions">

            <button
                type="button"
                data-language="en"
                class="language-btn"
                aria-label="Switch to English"
            >
                English
            </button>


            <button
                type="button"
                data-language="rw"
                class="language-btn"
                aria-label="Hindura mu Kinyarwanda"
            >
                Kinyarwanda
            </button>


            <button
                type="button"
                id="logoutBtn"
                class="logout-btn"
            >
                Logout
            </button>

        </div>

    </div>

</header>


<main class="products-page">

    <div class="products-header">

        <div class="products-title">

            <h1 data-i18n="productsTitle">
                Products
            </h1>

            <p data-i18n="productsSubtitle">
                View products, prices and current stock.
            </p>

        </div>


        <div class="branch-box">

            <label
                for="branchSelect"
                data-i18n="branch"
            >
                Branch
            </label>


            <select
                id="branchSelect"
                aria-label="Branch"
            ></select>

        </div>

    </div>


    <!-- SEARCH / CATEGORY -->

    <div class="products-toolbar">

        <input
            type="search"
            id="searchInput"
            placeholder="Search product, category or barcode..."
            data-i18n-placeholder="searchProducts"
            autocomplete="off"
        >


        <select id="categoryFilter">

            <option
                value=""
                data-i18n="allCategories"
            >
                All Categories
            </option>

        </select>

    </div>


    <!-- STATISTICS -->

    <section class="products-stats">

        <div class="product-stat">

            <div
                class="label"
                data-i18n="totalProducts"
            >
                Total Products
            </div>

            <div
                class="value number"
                id="totalProducts"
            >
                0
            </div>

        </div>


        <div class="product-stat">

            <div
                class="label"
                data-i18n="activeProducts"
            >
                Active Products
            </div>

            <div
                class="value number"
                id="activeProducts"
            >
                0
            </div>

        </div>


        <div class="product-stat warning">

            <div
                class="label"
                data-i18n="lowStock"
            >
                Low Stock
            </div>

            <div
                class="value number"
                id="lowStockProducts"
            >
                0
            </div>

        </div>


        <div class="product-stat danger">

            <div
                class="label"
                data-i18n="outOfStock"
            >
                Out of Stock
            </div>

            <div
                class="value number"
                id="outOfStockProducts"
            >
                0
            </div>

        </div>

    </section>


    <!-- PRODUCTS TABLE -->

    <section class="products-table-wrapper">

        <table class="products-table">

            <thead>

                <tr>

                    <th data-i18n="product">
                        Product
                    </th>

                    <th data-i18n="category">
                        Category
                    </th>

                    <th data-i18n="unit">
                        Unit
                    </th>

                    <th data-i18n="barcode">
                        Barcode
                    </th>

                    <th data-i18n="purchasePrice">
                        Purchase
                    </th>

                    <th data-i18n="sellingPrice">
                        Selling
                    </th>

                    <th data-i18n="stock">
                        Stock
                    </th>

                    <th data-i18n="minimumStock">
                        Minimum Stock
                    </th>

                    <th data-i18n="status">
                        Status
                    </th>

                </tr>

            </thead>


            <tbody id="productsBody">

                <tr>

                    <td
                        colspan="9"
                        class="loading-state"
                        data-i18n="loading"
                    >
                        Loading products...
                    </td>

                </tr>

            </tbody>

        </table>

    </section>

</main>


<footer class="page-footer">

/* =========================================================
   LANGUAGE
========================================================= */

function getLanguage() {

    try {

        if (
            window.DreamLandI18n &&
            typeof window.DreamLandI18n.getLanguage ===
                "function"
        ) {

            const language =
                window.DreamLandI18n.getLanguage();

            if (
                language === "en" ||
                language === "rw"
            ) {

                return language;

            }

        }

    }

    catch (error) {

        console.warn(
            "Shared language read failed:",
            error
        );

    }


    return (
        localStorage.getItem(
            "dreamland_language"
        ) === "rw"
            ? "rw"
            : "en"
    );

}


function t(key) {

    const language =
        getLanguage();


    return (
        translations[language]?.[key] ??
        translations.en[key] ??
        key
    );

}


/* =========================================================
   APPLY LANGUAGE
========================================================= */

function applyPageLanguage() {

    document.documentElement.lang =
        getLanguage();


    document
        .querySelectorAll("[data-i18n]")
        .forEach(element => {

            const key =
                element.dataset.i18n;


            element.textContent =
                t(key);

        });


    document
        .querySelectorAll(
            "[data-i18n-placeholder]"
        )
        .forEach(element => {

            const key =
                element.dataset.i18nPlaceholder;


            element.placeholder =
                t(key);

        });


    const logoutButton =
        document.getElementById(
            "logoutBtn"
        );


    if (logoutButton) {

        logoutButton.textContent =
            t("logout");

    }


    buildBranchSelector();

    buildCategories();

    renderProducts();

}


/* =========================================================
   PROFILE HELPERS
========================================================= */

function getRole() {

    return String(
        state.profile?.role || ""
    )
        .trim()
        .toLowerCase();

}


function getBranchId() {

    return (
        state.profile?.branch_id ||
        null
    );

}


/* =========================================================
   VALID BRANCH
========================================================= */

function isValidBranch(branchId) {

    return (
        branchId === BRANCH_IDS.kabuga ||
        branchId === BRANCH_IDS.bisenga
    );

}


/* =========================================================
   BUILD BRANCH SELECTOR
========================================================= */

function buildBranchSelector() {

    const select =
        document.getElementById(
            "branchSelect"
        );


    if (!select) {

        return;

    }


    const role =
        getRole();


    const assignedBranch =
        getBranchId();


    select.innerHTML = "";


    /*
     * ADMIN
     */

    if (
        role === "admin"
    ) {

        const options = [

            {
                value: "combined",
                label: t("combined")
            },

            {
                value: BRANCH_IDS.kabuga,
                label: t("kabuga")
            },

            {
                value: BRANCH_IDS.bisenga,
                label: t("bisenga")
            }

        ];


        options.forEach(optionData => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                optionData.value;


            option.textContent =
                optionData.label;


            select.appendChild(
                option
            );

        });


        if (
            state.branchId !== "combined" &&
            state.branchId !== BRANCH_IDS.kabuga &&
            state.branchId !== BRANCH_IDS.bisenga
        ) {

            state.branchId =
                "combined";

        }


        select.value =
            state.branchId;


        select.disabled = false;


        return;

    }


    /*
     * MANAGER / CASHIER
     */

    if (
        isValidBranch(
            assignedBranch
        )
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value =
            assignedBranch;


        option.textContent =
            assignedBranch ===
                BRANCH_IDS.kabuga
                ? t("kabuga")
                : t("bisenga");


        select.appendChild(
            option
        );


        state.branchId =
            assignedBranch;


        select.value =
            assignedBranch;


        select.disabled = true;


        return;

    }


    /*
     * NO VALID BRANCH
     */

    const option =
        document.createElement(
            "option"
        );


    option.value =
        "";


    option.textContent =
        t("noBranch");


    select.appendChild(
        option
    );


    state.branchId =
        null;


    select.value =
        "";


    select.disabled = true;

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts() {

    const body =
        document.getElementById(
            "productsBody"
        );


    if (!body) {

        return;

    }


    state.loading = true;


    body.innerHTML = `

        <tr>

            <td
                colspan="9"
                class="loading-state"
            >
                ${escapeHtml(
                    t("loading")
                )}
            </td>

        </tr>

    `;


    const {
        data,
        error
    } =
        await db

            .from("products")

            .select(`
                id,
                name,
                category,
                unit,
                barcode,
                purchase_price,
                selling_price,
                minimum_stock,
                active,
                created_at
            `)

            .order(
                "name",
                {
                    ascending: true
                }
            );


    state.loading = false;


    if (error) {

        console.error(
            "PRODUCTS LOAD ERROR:",
            error
        );


        state.products =
            [];


        state.stockMap =
            {};


        body.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="error-state"
                >
                    ${escapeHtml(
                        t("errorLoading")
                    )}
                </td>

            </tr>

        `;


        updateStats();


        return;

    }


    state.products =
        Array.isArray(data)
            ? data
            : [];


    buildCategories();


    await loadStock();


    renderProducts();

}


/* =========================================================
   LOAD STOCK MOVEMENTS
========================================================= */

async function loadStock() {

    state.stockMap =
        {};


    /*
     * The selected branch determines
     * which branch stock is displayed.
     */

    let query =
        db
            .from("stock_movements")
            .select(`
                product_id,
                branch_id,
                movement_type,
                quantity
            `);


    const role =
        getRole();


    /*
     * ADMIN
     *
     * Combined = both branches.
     * Specific branch = selected branch.
     */

    if (
        role === "admin"
    ) {

        if (
            state.branchId &&
            state.branchId !== "combined"
        ) {

            query =
                query.eq(
                    "branch_id",
                    state.branchId
                );

        }

    }


    /*
     * MANAGER / CASHIER
     *
     * Always restricted to own branch.
     */

    else {

        if (
            !isValidBranch(
                state.branchId
            )
        ) {

            console.warn(
                "No valid branch for stock query."
            );


            return false;

        }


        query =
            query.eq(
                "branch_id",
                state.branchId
            );

    }


    const {
        data,
        error
    } =
        await query;


    if (error) {

        console.error(
            "STOCK LOAD ERROR:",
            error
        );


        state.stockMap =
            {};


        return false;

    }


    for (
        const movement of data || []
    ) {

        const productId =
            movement.product_id;


        const quantity =
            Number(
                movement.quantity
            ) || 0;


        if (
            !Object.prototype.hasOwnProperty.call(
                state.stockMap,
                productId
            )
        ) {

            state.stockMap[productId] =
                0;

        }


        switch (
            movement.movement_type
        ) {

            /*
             * Main stock entering
             * the branch.
             */

            case "purchase":

                state.stockMap[productId] +=
                    quantity;

                break;


            /*
             * Server returns stock
             * to main branch stock.
             */

            case "return_from_server":

                state.stockMap[productId] +=
                    quantity;

                break;


            /*
             * Positive/negative adjustment.
             *
             * The quantity stored by the
             * system is authoritative.
             */

            case "adjustment":

                state.stockMap[productId] +=
                    quantity;

                break;


            /*
             * Sale removes stock from
             * the physical branch total.
             */

            case "sale":

                state.stockMap[productId] -=
                    quantity;

                break;


            /*
             * Waste removes stock.
             */

            case "waste":

                state.stockMap[productId] -=
                    quantity;

                break;


            /*
             * Issue to server moves stock
             * between locations inside
             * the same branch.
             *
             * Therefore it does NOT change
             * total physical stock.
             */

            case "issue_to_server":

                break;


            /*
             * Transfer is not part of
             * the current active workflow.
             */

            case "transfer":

                break;


            default:

                break;

        }

    }


    /*
     * UI protection only.
     *
     * Database remains authoritative.
     */

    Object.keys(
        state.stockMap
    ).forEach(
        productId => {

            if (
                state.stockMap[productId] < 0
            ) {

                state.stockMap[productId] =
                    0;

            }

        }
    );


    return true;

}


/* =========================================================
   BUILD CATEGORY FILTER
========================================================= */

function buildCategories() {

    const select =
        document.getElementById(
            "categoryFilter"
        );


    if (!select) {

        return;

    }


    const currentValue =
        select.value;


    const categories =
        [
            ...new Set(
                state.products

                    .map(
                        product =>
                            String(
                                product.category ||
                                ""
                            ).trim()
                    )

                    .filter(Boolean)
            )
        ]
        .sort(
            (a, b) =>
                a.localeCompare(
                    b
                )
        );


    select.innerHTML = "";


    const allOption =
        document.createElement(
            "option"
        );


    allOption.value =
        "";


    allOption.textContent =
        t("allCategories");


    select.appendChild(
        allOption
    );


    categories.forEach(
        category => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                category;


            option.textContent =
                category;


            select.appendChild(
                option
            );

        }
    );


    if (
        categories.includes(
            currentValue
        )
    ) {

        select.value =
            currentValue;

    }

}


/* =========================================================
   FILTER PRODUCTS
========================================================= */

function getFilteredProducts() {

    const searchInput =
        document.getElementById(
            "searchInput"
        );


    const categoryFilter =
        document.getElementById(
            "categoryFilter"
        );


    const search =
        String(
            searchInput?.value ||
            ""
        )
            .trim()
            .toLowerCase();


    const category =
        categoryFilter?.value ||
        "";


    return state.products.filter(
        product => {

            const name =
                String(
                    product.name ||
                    ""
                )
                    .toLowerCase();


            const productCategory =
                String(
                    product.category ||
                    ""
                )
                    .toLowerCase();


            const barcode =
                String(
                    product.barcode ||
                    ""
                )
                    .toLowerCase();


            const matchesSearch =
                !search ||
                name.includes(search) ||
                productCategory.includes(search) ||
                barcode.includes(search);


            const matchesCategory =
                !category ||
                product.category ===
                    category;


            return (
                matchesSearch &&
                matchesCategory
            );

        }
    );

}


/* =========================================================
   STOCK STATUS
========================================================= */

function getStockStatus(
    stock,
    minimumStock
) {

    const current =
        Number(stock) || 0;


    const minimum =
        Number(
            minimumStock
        ) || 0;


    if (
        current <= 0
    ) {

        return {

            className:
                "stock-out",

            text:
                t("out")

        };

    }


    if (
        minimum > 0 &&
        current <= minimum
    ) {

        return {

            className:
                "stock-low",

            text:
                t("low")

        };

    }


    return {

        className:
            "stock-normal",

        text:
            t("normal")

    };

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts() {

    const body =
        document.getElementById(
            "productsBody"
        );


    if (!body) {

        return;

    }


    updateStats();


    const products =
        getFilteredProducts();


    if (
        !products.length
    ) {

        body.innerHTML = `

            <tr>

                <td
                    colspan="9"
                    class="empty-state"
                >
                    ${escapeHtml(
                        t("noProducts")
                    )}
                </td>

            </tr>

        `;


        return;

    }


    body.innerHTML =
        products
            .map(
                product => {

                    const stock =
                        Number(
                            state.stockMap[
                                product.id
                            ] || 0
                        );


                    const minimum =
                        Number(
                            product.minimum_stock
                        ) || 0;


                    const stockStatus =
                        getStockStatus(
                            stock,
                            minimum
                        );


                    const active =
                        product.active === true;


                    const statusClass =
                        active
                            ? "status-active"
                            : "status-inactive";


                    const statusText =
                        active
                            ? t("active")
                            : t("inactive");


                    return `

                        <tr>

                            <td>

                                <strong>
                                    ${escapeHtml(
                                        product.name ||
                                        "-"
                                    )}
                                </strong>

                            </td>


                            <td>
                                ${escapeHtml(
                                    product.category ||
                                    "-"
                                )}
                            </td>


                            <td>
                                ${escapeHtml(
                                    product.unit ||
                                    "-"
                                )}
                            </td>


                            <td>
                                ${escapeHtml(
                                    product.barcode ||
                                    "-"
                                )}
                            </td>


                            <td class="number">

                                ${formatMoney(
                                    product.purchase_price
                                )}

                            </td>


                            <td class="number">

                                ${formatMoney(
                                    product.selling_price
                                )}

                            </td>


                            <td>

                                <span
                                    class="stock-badge ${stockStatus.className}"
                                >
                                    ${formatNumber(
                                        stock
                                    )}
                                </span>

                            </td>


                            <td class="number">

                                ${formatNumber(
                                    minimum
                                )}

                            </td>


                            <td>

                                <span
                                    class="status-badge ${statusClass}"
                                >
                                    ${escapeHtml(
                                        statusText
                                    )}
                                </span>

                            </td>

                        </tr>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   UPDATE STATISTICS
========================================================= */

function updateStats() {

    const total =
        state.products.length;


    const active =
        state.products.filter(
            product =>
                product.active === true
        ).length;


    let low =
        0;


    let out =
        0;


    state.products.forEach(
        product => {

            /*
             * Only active products should
             * generate operational low/out
             * stock warnings.
             */

            if (
                product.active !== true
            ) {

                return;

            }


            const stock =
                Number(
                    state.stockMap[
                        product.id
                    ] || 0
                );


            const minimum =
                Number(
                    product.minimum_stock
                ) || 0;


            if (
                stock <= 0
            ) {

                out++;

            }

            else if (
                minimum > 0 &&
                stock <= minimum
            ) {

                low++;

            }

        }
    );


    const totalElement =
        document.getElementById(
            "totalProducts"
        );


    const activeElement =
        document.getElementById(
            "activeProducts"
        );


    const lowElement =
        document.getElementById(
            "lowStockProducts"
        );


    const outElement =
        document.getElementById(
            "outOfStockProducts"
        );


    if (totalElement) {

        totalElement.textContent =
            formatNumber(
                total
            );

    }


    if (activeElement) {

        activeElement.textContent =
            formatNumber(
                active
            );

    }


    if (lowElement) {

        lowElement.textContent =
            formatNumber(
                low
            );

    }


    if (outElement) {

        outElement.textContent =
            formatNumber(
                out
            );

    }

}


/* =========================================================
   BRANCH CHANGE
========================================================= */

document
    .getElementById(
        "branchSelect"
    )
    .addEventListener(
        "change",
        async event => {

            if (
                getRole() !== "admin"
            ) {

                return;

            }


            const selected =
                event.target.value;


            if (
                selected !== "combined" &&
                selected !== BRANCH_IDS.kabuga &&
                selected !== BRANCH_IDS.bisenga
            ) {

                buildBranchSelector();

                return;

            }


            state.branchId =
                selected;


            await loadStock();


            renderProducts();

        }
    );

/* =========================================================
   LANGUAGE BUTTONS
========================================================= */

document.addEventListener(
    "click",
    async event => {

        const button =
            event.target.closest(
                "[data-language]"
            );


        if (!button) {

            return;

        }


        const language =
            button.dataset.language;


        if (
            language !== "en" &&
            language !== "rw"
        ) {

            return;

        }


        try {

            if (
                window.DreamLandI18n &&
                typeof window.DreamLandI18n.setLanguage ===
                    "function"
            ) {

                await window.DreamLandI18n.setLanguage(
                    language
                );

            }

            else {

                localStorage.setItem(
                    "dreamland_language",
                    language
                );

            }

        }

        catch (error) {

            console.warn(
                "LANGUAGE CHANGE ERROR:",
                error
            );


            localStorage.setItem(
                "dreamland_language",
                language
            );

        }


        applyPageLanguage();

    }
);

/* =========================================================
   FORMATTING
========================================================= */

function formatNumber(value) {

    const number =
        Number(value) || 0;


    return new Intl.NumberFormat(
        "en-US",
        {
            maximumFractionDigits: 2
        }
    ).format(
        number
    );

}


function formatMoney(value) {

    return (
        formatNumber(
            value
        ) +
        " RWF"
    );

}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

    return String(
        value ?? ""
    )
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================================
   INITIALIZE
========================================================= */

async function initializeProductsPage() {

    try {

        if (
            !window.DreamLandAuth ||
            typeof window.DreamLandAuth.requireAuth !==
                "function"
        ) {

            console.error(
                "DreamLandAuth is not available."
            );


            window.location.href =
                "index.html";


            return;

        }


        const authResult =
            await window.DreamLandAuth.requireAuth();


        if (!authResult) {

            return;

        }


        state.profile =
            authResult.profile;


        if (!state.profile) {

            console.error(
                "Authenticated user has no valid profile."
            );


            await window.DreamLandAuth.signOut();

            return;

        }


        state.role =
            getRole();


        state.branchId =
            getBranchId();


        /*
         * Only these three roles
         * may use the Products page.
         */

        const allowedRoles = [

            "admin",
            "manager",
            "cashier"

        ];


        if (
            !allowedRoles.includes(
                state.role
            )
        ) {

            console.warn(
                "PRODUCTS ACCESS DENIED:",
                state.role
            );


            if (
                typeof window.DreamLandAuth
                    .showAccessRestricted ===
                    "function"
            ) {

                window.DreamLandAuth
                    .showAccessRestricted();

            }

            else {

                window.location.href =
                    "dashboard.html";

            }


            return;

        }


        /*
         * Non-admin users must have
         * one of the two valid branches.
         */

        if (
            state.role !== "admin" &&
            !isValidBranch(
                state.branchId
            )
        ) {

            console.warn(
                "PRODUCTS BRANCH ACCESS DENIED:",
                state.branchId
            );


            if (
                typeof window.DreamLandAuth
                    .showAccessRestricted ===
                    "function"
            ) {

                window.DreamLandAuth
                    .showAccessRestricted();

            }

            else {

                window.location.href =
                    "dashboard.html";

            }


            return;

        }


        /*
         * Prepare interface.
         */

        applyPageLanguage();


        /*
         * Load products and stock.
         */

        await loadProducts();


        console.log(
            "PRODUCTS PAGE READY"
        );

    }

    catch (error) {

        console.error(
            "PRODUCTS PAGE INITIALIZATION ERROR:",
            error
        );

    }

}


initializeProductsPage();

</script>
